harness: antigravity
project:
  monorepo: false
  review: independent
  review_ledger: false
  rigor: standard
  shape: frontend
  stage: brownfield
  worktree: parallel
provider_mode: single
quick:
  max_files: 5
routing:
  review:
    allow_self_review_fallback: false
    independence: session
    max_cycles: 2
    require_independent: false
    role: review
  roles:
    docs:
      preferred:
      - main_harness
    frontend:
      preferred:
      - main_harness
    general:
      preferred:
      - main_harness
    review:
      preferred:
      - main_harness
rules:
  packs:
  - core
  - typescript
  - nextjs
  - react
schema_version: '2.5'
setup_cli_version: '2.5'
verify:
  checks:
    build: npm run build
    e2e: ''
    lint: npm run lint
    test: ''
    typecheck: npx tsc --noEmit
workflow_version: '2.5'
